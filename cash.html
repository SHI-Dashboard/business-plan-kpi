<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHI 주간 자금현황 보고서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--navy:#1f3a5f;--blue:#457b9d;--teal:#2a9d8f;--amber:#e9c46a;--orange:#f4a261;--red:#e76f51;--green:#2e8b57;--bg:#eef1f6;--card:#fff;--ink:#21303f;--muted:#6b7a8d;--line:#dde3ec;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Pretendard','Pretendard Variable','Segoe UI','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
header{background:linear-gradient(100deg,#1f3a5f,#2a5278);color:#fff;padding:20px 28px;box-shadow:0 2px 10px rgba(0,0,0,.12);}
.h-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
header h1{font-size:22px;font-weight:800;letter-spacing:-.4px;}
header .meta{font-size:14px;opacity:.95;margin-top:8px;display:flex;gap:18px;flex-wrap:wrap;}
header .meta b{color:#ffe;font-weight:700;}
.langbtn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;}
.langbtn:hover{background:rgba(255,255,255,.28);}
main{padding:22px 28px 60px;max-width:1400px;margin:0 auto;}
.sec{font-size:15px;font-weight:700;color:var(--navy);margin:26px 0 12px;padding-left:10px;border-left:4px solid var(--navy);display:flex;align-items:center;gap:8px;}
.sec .tag{font-size:10.5px;font-weight:600;background:var(--navy);color:#fff;padding:2px 8px;border-radius:10px;}
.hrk{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.diffc{cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px;}
.diffc:hover{opacity:.7;}
.subrow{display:none;}
.subrow.open{display:table-row;}
.subbox{background:#f7f9fc;border:1px solid #e4eaf2;border-radius:8px;padding:8px 10px;margin:2px 0;}
.subbox .sh{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px;}
.hc{position:relative;background:var(--card);border-radius:14px;padding:16px 17px 16px 19px;box-shadow:0 2px 8px rgba(31,58,95,.08);border:1px solid var(--line);overflow:hidden;transition:.15s;}
.hc:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,58,95,.13);}
.hc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--acc,#2a9d8f);}
.hc .ic{position:absolute;right:13px;top:13px;font-size:22px;opacity:.20;}
.hc .lab{font-size:11.5px;color:var(--muted);font-weight:700;}
.hc .big{font-size:25px;font-weight:800;color:var(--navy);line-height:1.05;margin-top:6px;letter-spacing:-.5px;}
.hc .big small{font-size:13px;font-weight:600;color:#5a6b7d;}
.hc .sub2{font-size:11.5px;margin-top:6px;font-weight:600;color:var(--muted);}
.up{color:var(--teal);}.down{color:var(--red);}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(3,1fr);}
.card{background:var(--card);border-radius:12px;padding:16px 18px;box-shadow:0 1px 4px rgba(31,58,95,.07);border:1px solid var(--line);}
.card h3{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:3px;}
.card .ch-sub{font-size:11px;color:var(--muted);margin-bottom:10px;}
.cv{position:relative;height:280px;}
.cv.sm{height:230px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:right;}
th:first-child,td:first-child{text-align:left;}
thead th{background:#f3f6fa;color:var(--navy);font-weight:700;}
.lvl0{font-weight:700;background:#eef2f7;}
.pos{color:var(--teal);}.neg{color:var(--red);}
.tgl{background:var(--navy);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;}
.tgl:hover{background:#2a5278;}
.wrap{max-height:0;overflow:hidden;transition:max-height .4s;}
.wrap.open{max-height:1600px;overflow:auto;margin-top:12px;}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;}
.pill.ok{background:#e2f3ea;color:#1c6b41;}
.note{background:#eef3f9;border-left:4px solid var(--blue);padding:11px 14px;border-radius:6px;font-size:13.5px;color:#3a4d61;margin-bottom:14px;}
@media(max-width:1100px){.hrk{grid-template-columns:repeat(2,1fr);}}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <div class="h-row">
    <div>
      <h1 data-ko="💰 SHI 주간 자금현황 보고서" data-en="💰 SHI Weekly Cash Position Report"></h1>
      <div style="margin-top:6px"><span style="display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:2px 10px;border-radius:999px;letter-spacing:.02em">(Weekly Update)</span></div>
      <div class="meta">
        <span><span data-ko="전주 실적" data-en="Last Week Actual"></span> <b id="m-period"></b></span>
        <span><span data-ko="적용환율" data-en="FX Rate"></span> <b id="m-rate"></b> IDR/USD</span>
        <span data-ko="단위 <b>USD</b> (세부 IDR 병기)" data-en="Unit <b>USD</b> (details in IDR)"></span>
      </div>
    </div>
    <button class="langbtn" id="langbtn" onclick="toggleLang()">EN</button>
  </div>
</header>
<main>
  <div class="note" id="topnote"></div>
  <div class="sec"><span data-ko="핵심 지표" data-en="Key Indicators"></span> <span class="tag" data-ko="전주 실적 마감" data-en="Last Week Actual"></span></div>
  <div class="hrk" id="kpi"></div>

  <div class="sec"><span data-ko="전주 자금 흐름" data-en="Last Week Cash Flow"></span> <span class="tag">Cash Flow</span></div>
  <div class="grid g2">
    <div class="card"><h3 data-ko="자금흐름 워터폴" data-en="Cash Flow Waterfall"></h3><div class="ch-sub" data-ko="주초잔액 → 환전 → 수입 → 지출 → 주말잔액 (USD)" data-en="Start → FX → Receipt → Payment → Wk-end (USD)"></div><div class="cv"><canvas id="c_wf"></canvas></div></div>
    <div class="card"><h3 data-ko="주차별 추이" data-en="Weekly Trend"></h3><div class="ch-sub" data-ko="수입·지출(막대) · 기말잔액(선) · W4는 계획(Plan)" data-en="Receipt·Payment(bar) · Ending(line) · W4 is Plan"></div><div class="cv"><canvas id="c_week"></canvas></div></div>
  </div>

  <div class="sec"><span data-ko="계획 대비 실적" data-en="Plan vs Actual"></span> <span class="tag">Plan vs Actual</span></div>
  <div class="grid g2">
    <div class="card"><h3 data-ko="수입 · 지출 · 예상잔액 — 계획 vs 실적" data-en="Receipt · Payment · Ending Balance — Plan vs Actual"></h3><div class="ch-sub" data-ko="전주 실적 기준 (USD)" data-en="Last week actual (USD)"></div><div class="cv sm"><canvas id="c_pva"></canvas></div></div>
    <div class="card"><h3 data-ko="차이 요약 (실적 − 계획)" data-en="Variance (Actual − Plan)"></h3><div class="ch-sub" data-ko="달성률 및 주요 변동요인" data-en="Achievement & key drivers"></div><div id="pva_tbl"></div></div>
  </div>

  <div class="sec"><span data-ko="수입 · 지출 세부내역" data-en="Receipt · Payment Details"></span> <span class="tag" data-ko="토글 · 차이 클릭 시 세부" data-en="Toggle · click Diff for detail"></span>
    <button class="tgl" style="margin-left:auto;font-size:11.5px;padding:7px 13px;background:var(--green)" onclick="downloadExcel()"><span data-ko="⬇ 엑셀 다운로드" data-en="⬇ Download Excel"></span></button></div>
  <div class="grid g2">
    <div class="card"><h3 data-ko="수입 세부 (계획 vs 실적)" data-en="Receipt Details (Plan vs Actual)"></h3><div class="ch-sub" data-ko="영업·투자·재무 활동 · <b>차이 금액 클릭</b> → 구성 거래처" data-en="Operating·Investing·Financing · <b>click Diff</b> → counterparties"></div>
      <button class="tgl" data-tgl="recd" onclick="tg('recd')"></button><div class="wrap" id="recd"></div></div>
    <div class="card"><h3 data-ko="지출 세부 (계획 vs 실적)" data-en="Payment Details (Plan vs Actual)"></h3><div class="ch-sub" data-ko="인건비·자재·경비·세금 · <b>차이 금액 클릭</b> → 구성 거래처" data-en="Labor·Material·Expense·Tax · <b>click Diff</b> → counterparties"></div>
      <button class="tgl" data-tgl="payd" onclick="tg('payd')"></button><div class="wrap" id="payd"></div></div>
  </div>

  <div class="sec"><span data-ko="은행별 잔액 · 유동성" data-en="Bank Balances · Liquidity"></span> <span class="tag" data-ko="무차입" data-en="Debt-free"></span></div>
  <div class="grid g2">
    <div class="card"><h3 data-ko="은행별 보통예금 잔액 (주초 → 주말)" data-en="Bank Ordinary Deposits (Start → Wk-end)"></h3><div class="ch-sub" data-ko="단위 백만 IDR" data-en="Unit: million IDR"></div><div class="cv sm"><canvas id="c_bank"></canvas></div>
      <button class="tgl" style="margin-top:10px" data-tgl="bankd" onclick="tg('bankd')"></button><div class="wrap" id="bankd"></div></div>
    <div class="card"><h3 data-ko="유동성 구성" data-en="Liquidity Composition"></h3><div class="ch-sub" data-ko="가용현금 + 정기예금 (USD)" data-en="Available cash + time deposits (USD)"></div><div class="cv sm"><canvas id="c_liq"></canvas></div>
      <button class="tgl" style="margin-top:10px" data-tgl="depd" onclick="tg('depd')"></button><div class="wrap" id="depd"></div></div>
  </div>

  <div class="sec"><span data-ko="자산 · 부채" data-en="Assets · Liabilities"></span> <span class="tag" data-ko="운전자본" data-en="Working Capital"></span></div>
  <div class="grid g2">
    <div class="card"><h3 data-ko="매출채권 · 매입채무" data-en="Accounts Receivable · Payable"></h3><div class="ch-sub" data-ko="AR / AP / 순채권 (USD)" data-en="AR / AP / Net (USD)"></div><div class="cv sm"><canvas id="c_arap"></canvas></div></div>
    <div class="card"><h3 data-ko="자산·부채 요약" data-en="Assets·Liabilities Summary"></h3><div class="ch-sub" data-ko="기타 항목 포함" data-en="incl. other items"></div><div id="arap_tbl"></div></div>
  </div>
  <div class="sec" style="border-left-color:var(--amber);color:#8a6d1f"><span data-ko="금주 자금계획" data-en="This Week Cash Plan"></span> <span class="tag" style="background:var(--amber);color:#6b4e00">Plan · <span id="plan-period"></span></span></div>
  <div class="note" id="plannote" style="background:#fdf6e6;border-left-color:var(--amber);color:#6b5320"></div>
  <div class="hrk" id="plan-kpi"></div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3 data-ko="금주 자금계획 워터폴" data-en="Cash Plan Waterfall"></h3><div class="ch-sub" data-ko="전주이월 → 입금예정 → 지출예정 → 예상잔액 (USD)" data-en="Carryover → Receipts → Payments → Ending (USD)"></div><div class="cv"><canvas id="c_pwf"></canvas></div></div>
    <div class="card"><h3 data-ko="입금예정 (고객별)" data-en="Planned Receipts (by customer)"></h3><div class="ch-sub" data-ko="매출채권 회수 계획 · USD환산" data-en="AR collection plan · USD-eq"></div><div class="cv"><canvas id="c_pinc"></canvas></div></div>
  </div>
  <div class="note" id="foot" style="margin-top:26px;border-left-color:var(--muted);color:var(--muted);font-size:11.5px"></div>
</main>

function subHtml(i){if(!i.sub||!i.sub.length)return '<div class="subbox"><span style="color:var(--muted)">'+tr('세부 거래처 정보 없음','No counterparty detail')+'</span></div>';

 const rows=i.sub.map(s=>{const dI=(s.aIDR||0)-(s.pIDR||0),dU=(s.aUSD||0)-(s.pUSD||0);const vn=only?tr('(거래처 미기재)','(not specified)'):s.ven;
  return `<tr><td>${vn}</td><td>${idr(s.pIDR)}</td><td>${idr(s.aIDR)}</td><td class="${dI>=0?'pos':'neg'}">${dI?(dI>0?'+':'')+idr(dI):'–'}</td><td>${s.pUSD?usd(s.pUSD):'–'}</td><td>${s.aUSD?usd(s.aUSD):'–'}</td><td class="${dU>=0?'pos':'neg'}">${dU?(dU>0?'+':'')+usd(dU):'–'}</td></tr>`;}).join('');
 return `<div class="subbox"><div class="sh">${tr('「'+i.ko+'」 구성 거래처 · IDR·USD 계획대비실적','「'+i.ko+'」 counterparties · IDR·USD Plan vs Actual')} (${tr('합계 차이','total diff')} ${(i.diff>=0?'+':'')+usd(i.diff)})</div>

  ${only?'<div style="font-size:11px;color:var(--muted);margin-top:5px">'+tr('※ 원자료에 거래처 세부가 없어 합계만 표기.','※ Source has no counterparty detail; total only.')+'</div>':''}</div>`;}

function detTable(id,items){let tp=0,ta=0;let h='<table><thead><tr><th>'+tr('항목','Item')+'</th><th>'+tr('구분','Group')+'</th><th>'+tr('계획','Plan')+'</th><th>'+tr('실적','Actual')+'</th><th>'+tr('차이','Diff')+' ▾</th></tr></thead><tbody>';
 items.forEach((i,ix)=>{const d=i.actual-i.plan;tp+=i.plan;ta+=i.actual;const sid=id+'_s'+ix;
  h+=`<tr><td>${i.ko}</td><td style="text-align:left;color:var(--muted);font-size:11px">${i.cat}</td><td>${usd(i.plan)}</td><td>${usd(i.actual)}</td><td class="${d>=0?'pos':'neg'} diffc" onclick="toggleSub('${sid}')">${(d>=0?'+':'')+usd(d)}</td></tr>`;

 h+=`<tr class="lvl0"><td>${tr('합계','Total')}</td><td></td><td>${usd(tp)}</td><td>${usd(ta)}</td><td class="${ta-tp>=0?'pos':'neg'}">${(ta-tp>=0?'+':'')+usd(ta-tp)}</td></tr></tbody></table>`;

 items.forEach(i=>{const sub=i.sub||[];const pI=sub.reduce((a,s)=>a+(s.pIDR||0),0),aI=sub.reduce((a,s)=>a+(s.aIDR||0),0);const pU=sub.reduce((a,s)=>a+(s.pUSD||0),0),aU=sub.reduce((a,s)=>a+(s.aUSD||0),0);TpI+=pI;TaI+=aI;TpU+=pU;TaU+=aU;
  styleRow(ws.addRow([i.cat,i.ko,pI,aI,aI-pI,pU,aU,aU-pU]),{fill:'FF3E6491',white:true,bold:true});
  sub.forEach(s=>styleRow(ws.addRow(['','   └ '+s.ven,s.pIDR||0,s.aIDR||0,(s.aIDR||0)-(s.pIDR||0),s.pUSD||0,s.aUSD||0,(s.aUSD||0)-(s.pUSD||0)]),{}));});
 styleRow(ws.addRow([tr('합계','Total'),'',TpI,TaI,TaI-TpI,TpU,TaU,TaU-TpU]),{fill:'FF1F3A5F',white:true,bold:true});
 ws.views=[{state:'frozen',ySplit:2}];}
async function downloadExcel(){
 if(typeof ExcelJS==='undefined'){alert(tr('엑셀 라이브러리 로딩 중입니다. 잠시 후 다시 시도해 주세요.','Excel library loading, please retry shortly.'));return;}
 const wb=new ExcelJS.Workbook();wb.creator='SHI';
 buildSheet(wb.addWorksheet(tr('수입세부 차이내역','Receipt Detail Variance')),CD.det_receipt);
 buildSheet(wb.addWorksheet(tr('지출세부 차이내역','Payment Detail Variance')),CD.det_payment);
 const buf=await wb.xlsx.writeBuffer();const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SHI_Weekly_Cash_Detail_'+CD.period.replace(/[^0-9]/g,'').slice(0,8)+'.xlsx';
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
render();
</script>
